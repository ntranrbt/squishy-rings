name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # lets the auto-bump job re-trigger the pipeline on the bump commit

jobs:
  version-check:
    name: Version Gate & Auto-Bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch the build run on the bump commit
    outputs:
      should_build: ${{ steps.bump.outputs.should_build || steps.export.outputs.should_build }}
      release_version: ${{ steps.bump.outputs.release_version || steps.export.outputs.release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2 # HEAD + parent, to compare version.txt against the previous commit

      - name: Auto-bump patch version on main pushes
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }} # gh inside Actions does not read GITHUB_TOKEN automatically
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < version.txt)"
          prev="$(git show HEAD~1:version.txt 2>/dev/null | tr -d '[:space:]' || true)"

          # If this commit already bumped the version (human or bot), build it as-is.
          if [ -n "$prev" ] && [ "$current" = "$prev" ]; then
            if ! printf '%s' "$current" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version.txt must be x.y.z (e.g. 1.0.83), got: '$current'"
              exit 1
            fi
            major_minor="${current%.*}"
            patch="${current##*.}"
            new="$major_minor.$((10#$patch + 1))"
            printf '%s\n' "$new" > version.txt
            git config user.name "squishy-rings-version-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version.txt
            git commit -m "chore: auto-bump version to $new"
            # Rebase onto any concurrent pushes, retry the push, then hand off:
            # GITHUB_TOKEN pushes do not re-trigger `push` workflows, so kick the
            # pipeline off explicitly once the bump commit is on main.
            for _ in 1 2 3; do
              git pull --rebase origin main >/dev/null 2>&1 || true
              if [ "$(tr -d '[:space:]' < version.txt)" != "$new" ]; then
                echo "Concurrent run already bumped to $(tr -d '[:space:]' < version.txt); standing down."
                echo "should_build=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if git push origin HEAD:main >/dev/null 2>&1; then
                echo "Bumped version to $new; dispatching the pipeline to build it."
                sleep 2 # let the push propagate before the dispatch resolves main
                gh workflow run build-and-test.yml --ref main || echo "::warning::could not dispatch build run"
                break
              fi
              sleep 2
            done
            echo "release_version=$new" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release_version=$current" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Export build gate for non-main events
        id: export
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "release_version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

  test:
    name: Run Unit Tests
    needs: version-check
    if: needs.version-check.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

  build-android:
    name: Build Android App
    needs: [test, version-check]
    runs-on: ubuntu-latest
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && needs.version-check.outputs.should_build == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Android release signing inputs
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for var in KEYSTORE_FILE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is required for a release-signed Android AAB"
              exit 1
            fi
          done

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/composeApp/release.jks"

      - name: Build Android release AAB
        run: ./gradlew :composeApp:bundleRelease
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/composeApp/release.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Android release AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: squishy-rings-android-release-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          if-no-files-found: error

  build-ios:
    name: Build iOS App
    needs: [test, version-check]
    runs-on: macos-26
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && needs.version-check.outputs.should_build == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: default
          bundler-cache: true

      - name: Build iOS App
        working-directory: iosApp
        run: bundle exec fastlane ios build_release_artifact
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: squishy-rings-ios-release-ipa
          path: iosApp/build/ci-release/Squishy-Rings.ipa
          if-no-files-found: error

  build-wasm:
    name: Build & Deploy Web App
    needs: [test, version-check]
    runs-on: ubuntu-latest
    if: false # no web target in squishy-rings
    steps:
      - name: Skipped
        run: echo "no wasm target"

  deploy-android:
    name: Deploy Android to Play Internal
    needs: [build-android, version-check]
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && needs.version-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: default
          bundler-cache: true

      - name: Create Google Play Service Account Key
        run: echo '${{ secrets.PLAY_STORE_CONFIG_JSON }}' > "${{ github.workspace }}/composeApp/play_config.json"

      - name: Download Android release AAB artifact
        uses: actions/download-artifact@v7
        with:
          name: squishy-rings-android-release-aab
          path: composeApp/build/outputs/bundle/release

      - name: Deploy with Fastlane
        working-directory: composeApp
        run: bundle exec fastlane android deploy
        env:
          ANDROID_PLAY_CONFIG_JSON_PATH: ${{ github.workspace }}/composeApp/play_config.json
          ANDROID_PLAY_TRACK: internal
          ANDROID_PLAY_RELEASE_STATUS: draft
          ANDROID_AAB_PATH: ${{ github.workspace }}/composeApp/build/outputs/bundle/release/composeApp-release.aab

  deploy-ios:
    name: Deploy iOS to TestFlight
    needs: [build-ios, version-check]
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && needs.version-check.outputs.should_build == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: default
          bundler-cache: true

      - name: Download iOS release IPA artifact
        uses: actions/download-artifact@v7
        with:
          name: squishy-rings-ios-release-ipa
          path: iosApp/build/ci-release

      - name: Deploy prebuilt iOS artifact
        working-directory: iosApp
        run: bundle exec fastlane ios deploy
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          IOS_IPA_PATH: ${{ github.workspace }}/iosApp/build/ci-release/Squishy-Rings.ipa

